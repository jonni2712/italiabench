question: |
  Da quanti caratteri alfanumerici è composto il codice fiscale italiano
  rilasciato a una persona fisica?
ground_truth: "16"
must_mention:
  - any_of:
      - "16"
      - "sedici"
must_not_mention:
  - "11 caratteri"
  - "13 caratteri"
  - "20 caratteri"
