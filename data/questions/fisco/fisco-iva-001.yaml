schema_version: 1
id: fisco-iva-001
category: fisco
difficulty: easy
question: |
  Qual è l'aliquota IVA applicata ai libri in Italia nel 2026?
ground_truth: "4%"
must_mention:
  - "4%"
must_not_mention:
  - "10%"
  - "22%"
source:
  - "DPR 633/72, Tabella A, parte II, n. 18"
  - "https://www.agenziaentrate.gov.it/portale/web/guest/aliquote-iva"
last_verified: 2026-05-15
tags:
  - iva
  - libri
notes: |
  Aliquota stabile dal 1972; da rivedere se il legislatore introduce
  modifiche tramite la prossima legge di bilancio.

  Design history (claude-opus-4-7, 2026-05-15):
  1. Primo any_of (aliquota minima/super-ridotta) rimosso: la domanda
     testa il fatto (aliquota), non la terminologia preferita.
  2. La parentetica "(esclusi quelli a contenuto pornografico)" nel
     wording originale invitava il modello a citare anche il 22% come
     contrasto, scattando il must_not_mention. Domanda riformulata
     senza parentetica.
  Lezione doppia: must_mention testa il fatto, e la domanda non deve
  invitare il modello a parlare di rate "vicine" che sono in
  must_not_mention.
