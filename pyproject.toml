[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "italiabench"
dynamic = ["version"]
description = "Open benchmark for measuring LLM hallucinations on Italian knowledge (law, tax, geography, history, public administration)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ItaliaBench contributors" },
]
keywords = ["llm", "benchmark", "evaluation", "hallucination", "italian", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Italian",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "joblib>=1.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.39"]
google = ["google-genai>=0.3"]
ollama = ["ollama>=0.3"]
hf = ["datasets>=2.20", "huggingface-hub>=0.24"]
all = [
    "openai>=1.40",
    "anthropic>=0.39",
    "google-genai>=0.3",
    "ollama>=0.3",
    "datasets>=2.20",
    "huggingface-hub>=0.24",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/jonni2712/italiabench"
Repository = "https://github.com/jonni2712/italiabench"
Documentation = "https://github.com/jonni2712/italiabench#readme"
Issues = "https://github.com/jonni2712/italiabench/issues"

[project.scripts]
italiabench = "italiabench.cli:app"

[tool.hatch.version]
path = "italiabench/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/italiabench",
    "/data",
    "/tests",
    "/README.md",
    "/README.it.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["italiabench"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=italiabench --cov-report=term-missing"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
